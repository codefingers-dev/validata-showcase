<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="${title}">Review Fraud Analysis</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-dark bg-dark">
  <div class="container-fluid">
    <span class="navbar-brand mb-0 h1">🔍 FraudLens Review</span>
    <a href="/reviews/dashboard" class="btn btn-outline-light btn-sm">Back</a>
  </div>
</nav>

<div class="container mt-5">
  <div class="row">
    <!-- Fraud Analysis Results -->
    <div class="col-md-8">
      <div class="card mb-4">
        <div class="card-header bg-primary text-white">
          <h5>Fraud Analysis Results</h5>
        </div>
        <div class="card-body">
          <!-- TODO: Load from API -->
          <div class="row">
            <div class="col-md-6">
              <h6>Invoice: RE-2025-12345</h6>
              <p>Workshop: Auto Müller GmbH</p>
            </div>
            <div class="col-md-6">
              <h6 class="text-warning">Risk Score: 45</h6>
              <p class="text-warning">Risk Level: MEDIUM</p>
            </div>
          </div>
          <hr>
          <h6>Red Flags Detected:</h6>
          <ul>
            <li>High repair amount (€850)</li>
            <li>Missing VAT ID</li>
          </ul>
        </div>
      </div>
    </div>

    <!-- Review Decision Form -->
    <div class="col-md-4">
      <div class="card">
        <div class="card-header bg-success text-white">
          <h5>Make Decision</h5>
        </div>
        <div class="card-body">
          <form id="decisionForm">
            <div class="mb-3">
              <label class="form-label">Decision</label>
              <select class="form-select" name="decision" required>
                <option value="">-- Select --</option>
                <option value="APPROVED">✅ Approve</option>
                <option value="REJECTED">❌ Reject</option>
                <option value="ESCALATED">⚠️ Escalate to SIU</option>
              </select>
            </div>

            <div class="mb-3">
              <label class="form-label">Reviewer Name</label>
              <input type="text" class="form-control" name="reviewerName"
                     value="John Smith" required>
            </div>

            <div class="mb-3">
              <label class="form-label">Comment</label>
              <textarea class="form-control" name="comment" rows="3"
                        placeholder="Your review comment..."></textarea>
            </div>

            <button type="submit" class="btn btn-success w-100">
              Submit Decision
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  document.getElementById('decisionForm').addEventListener('submit', function(e) {
      e.preventDefault();

      const formData = new FormData(this);
      const fraudAnalysisId = new URLSearchParams(window.location.search).get('id') || 'RE-2025-12345';

      fetch(`/api/v1/reviews/${fraudAnalysisId}/decision`, {
          method: 'POST',
          headers: {
              'Content-Type': 'application/json'
          },
          body: JSON.stringify({
              decision: formData.get('decision'),
              reviewerName: formData.get('reviewerName'),
              comment: formData.get('comment')
          })
      })
      .then(response => response.json())
      .then(data => {
          alert('Decision saved successfully!');
          window.location.href = '/reviews/dashboard';
      })
      .catch(error => {
          alert('Error saving decision: ' + error.message);
      });
  });
</script>
</body>
</html>
