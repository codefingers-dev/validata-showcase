version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: fraudlens-db
    environment:
      POSTGRES_DB: fraudlens
      POSTGRES_USER: fraudlens
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fraudlens"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fraudlens-network
    restart: unless-stopped

  # FraudLens API
  fraudlens-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fraudlens-api
    environment:
      SPRING_PROFILE: local
      DB_URL: jdbc:postgresql://postgres:5432/fraudlens
      DB_USER: fraudlens
      DB_PASSWORD: password
      SERVER_PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - fraudlens-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/invoices/health"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  fraudlens-network:
    driver: bridge

volumes:
  postgres_data:
